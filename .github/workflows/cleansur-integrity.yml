name: CleanSur JavaScript integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript modules
        run: |
          set -e
          find erp/js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Validate HTML entrypoints and required assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = ['erp/index.html', 'erp/tienda.html', 'tienda/index.html',
                   'erp/js/app.js', 'erp/js/tienda_standalone.js',
                   'erp/assets/cleansur-brand.css', 'erp/assets/cleansur-isotipo.svg']
          missing = [p for p in paths if not Path(p).is_file()]
          if missing:
              raise SystemExit('Missing application files: ' + ', '.join(missing))
          for html in ['erp/index.html','erp/tienda.html','tienda/index.html']:
              content = Path(html).read_text(encoding='utf-8')
              if 'cleansur-brand.css' not in content:
                  raise SystemExit(f'Brand stylesheet not linked in {html}')
          print('Entrypoints and brand assets: OK')
          PY
