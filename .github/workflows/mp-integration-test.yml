name: StayClean MP integration tests
on:
  push:
    branches:
      - test/mp-checkout-current-main-20261116
      - fix/cleansur-mp-webhook
  workflow_dispatch:
jobs:
  webhook:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real webhook with mocked MP and Supabase
        run: node --test tests/mp-webhook.integration.test.mjs
